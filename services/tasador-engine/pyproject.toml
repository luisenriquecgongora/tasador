[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tasador-engine"
version = "0.1.0"
description = "Photos of a physical item in, JSON out: what it is (name, brand, model, type, serial) and what it costs, with sources"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-PolyForm-Shield-1.0.0" }
authors = [{ name = "Luis Enrique" }]
keywords = ["product-recognition", "visual-search", "ocr", "fastapi", "appraisal"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pillow>=10.3.0",
    "anthropic>=2.8.0",
]

[project.optional-dependencies]
# Each extra switches on one stage; the engine reports missing ones in /v1/capabilities.
ocr = ["rapidocr-onnxruntime>=1.3.0", "numpy>=1.26.0"]
barcode = ["zxing-cpp>=2.2.0"]
heic = ["pillow-heif>=0.16.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Lint rules pinned here so CI and local runs agree regardless of personal configs.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
