<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasador</title>
<style>
  :root {
    --bg: #f6f7f9; --bar: #ffffff; --text: #1f2430; --muted: #6b7280; --line: #e3e6ea; --accent: #2563eb;
    --accent-text: #fff; --ok: #15803d; --ok-bg: #dcfce7; --warn: #a16207; --warn-bg: #fef9c3; --bad: #b91c1c; --bad-bg: #fee2e2;
    --off: #6b7280; --off-bg: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --bar: #1b1f27; --text: #e7e9ee; --muted: #9aa3b2; --line: #2c323d; --accent: #5b8cff; --accent-text: #0b1020;
      --ok: #86efac; --ok-bg: #14301f; --warn: #fde68a; --warn-bg: #3a3214; --bad: #fca5a5; --bad-bg: #3b1d1d; --off: #9aa3b2; --off-bg: #262b35;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--bar); border-bottom: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 15px; margin-right: auto; }
  .pill { border-radius: 999px; padding: 2px 10px; font-size: 12.5px; background: var(--off-bg); color: var(--off); white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  label { color: var(--muted); font-size: 12.5px; }
  input[type=number] { width: 88px; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  button { border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; font: inherit; cursor: pointer; background: var(--bg); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  .note { color: var(--muted); font-size: 12px; }
  .note.bad { color: var(--bad); }
  main { flex: 1; position: relative; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  #panel { position: absolute; inset: 0; padding: 24px 18px; overflow: auto; }
  #panel h2 { font-size: 16px; margin: 0 0 8px; }
  #panel pre { white-space: pre-wrap; background: var(--bar); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: 12.5px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="row">
    <span class="brand">🔎 Tasador</span>
    <span class="pill" id="engine-pill">Engine: …</span>
    <span class="pill" id="search-pill">Local search: …</span>
  </div>
  <div class="row">
    <label for="port">Port</label>
    <input id="port" type="number" min="1024" max="65535">
    <button id="apply" class="primary">Apply</button>
    <button id="pin" aria-pressed="false" title="Keep this window above other windows">📌 Pin</button>
    <button id="browser" title="Open the settings page in your browser">Open in browser</button>
  </div>
  <div class="note" id="note"></div>
</header>
<main>
  <iframe id="settings" class="hidden" title="Tasador settings"></iframe>
  <div id="panel"><h2>Starting…</h2><p class="note">Tasador is starting its engine. This takes a few seconds.</p></div>
</main>
<script src="app.js"></script>
</body>
</html>
