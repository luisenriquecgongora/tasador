[package]
name = "tasador-desktop"
version = "0.1.0"
description = "Tasador desktop app: a small settings window around the local engine"
authors = ["Luis Enrique"]
license = "LicenseRef-PolyForm-Shield-1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
